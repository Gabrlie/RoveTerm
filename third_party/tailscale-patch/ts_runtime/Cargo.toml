[package]
name = "ts_runtime"
version = "0.7.1"
description = "tailscale runtime"
categories = ["network-programming"]
keywords = ["tailscale", "runtime"]

repository = "https://github.com/tailscale/tailscale-rs"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.92.0"

[dependencies]
# Our crates.
ts_bart = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_bart_packetfilter = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_capabilityversion = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_control_serde = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_http_util = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_control = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_dataplane = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_disco_protocol = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_keys = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_netcheck = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_netmon = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_netstack_smoltcp = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1", features = ["tokio"] }
ts_packet = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_packetfilter = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1", features = ["checking-filter"] }
ts_packetfilter_state = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_transport = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_derp = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_tunnel = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1" }
ts_util = { git = "https://github.com/tailscale/tailscale-rs", rev = "e88a60083ed2b9b2b8fd62733fe86ea887e72780", version = "0.7.1", default-features = false }

# Unconditionally required dependencies.
futures = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
ipnet = { version = "2.12", default-features = false }
kameo = "0.21"
kameo_actors = "0.6"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tokio-stream = { version = "0.1", default-features = false, features = ["time", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
smallvec = "1.15"
smol_str = "0.3"
yoke = { version = "0.8", default-features = false }
zeroize = "1.8.2"
url = { version = "2", default-features = false }
rand = "0.10"
bytes = "1"
itertools = "0.14"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false }
itertools = "0.14"
proptest = "1"
tokio-test = "0.4"

[features]
console = ["kameo/console"]
otel = ["kameo/otel", "kameo/tracing"]

[package.metadata.cargo-machete]
ignored = ["tokio-test"]
