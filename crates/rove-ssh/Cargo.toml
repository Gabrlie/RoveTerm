[package]
name = "rove-ssh"
description = "SSH terminal provider for RoveTerm: authentication, host key verification, connection sharing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
parking_lot.workspace = true
rove-kernel = { path = "../rove-kernel" }
rove-session = { path = "../rove-session" }
rove-vault = { path = "../rove-vault" }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tracing.workspace = true
uuid.workspace = true
zeroize = "1"

[dev-dependencies]
devsshd = { path = "../../tools/devsshd" }
rove-vault = { path = "../rove-vault", features = ["memory-key-cache"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
