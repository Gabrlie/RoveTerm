[package]
name = "rove-ssh"
description = "SSH terminal provider for RoveTerm: authentication, host key verification, connection sharing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
parking_lot.workspace = true
rand = { version = "0.10", features = ["thread_rng"] }
rove-kernel = { path = "../rove-kernel" }
rove-fs = { path = "../rove-fs" }
rove-session = { path = "../rove-session" }
rove-vault = { path = "../rove-vault" }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize = "1"

[dev-dependencies]
devsshd = { path = "../../tools/devsshd" }
tempfile = "3"
rove-vault = { path = "../rove-vault", features = ["memory-key-cache"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
