[package]
name = "rove-vault"
description = "Host, credential and known-host storage with device-key encryption for RoveTerm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Exposes MemoryKeyCache, a non-persistent KeyCache for tests and development builds.
memory-key-cache = []

[dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
parking_lot.workspace = true
rove-kernel = { path = "../rove-kernel" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize = { version = "1", features = ["derive", "serde"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4"

[dev-dependencies]
tempfile = "3"
rove-vault = { path = ".", features = ["memory-key-cache"] }
