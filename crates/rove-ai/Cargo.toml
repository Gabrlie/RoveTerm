[package]
name = "rove-ai"
description = "AI agents for RoveTerm: ACP client, approval policy and host-bound tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
getrandom = "0.3"
rove-fs = { path = "../rove-fs" }
rove-journal = { path = "../rove-journal" }
rove-ssh = { path = "../rove-ssh" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "fs", "rt", "net", "macros", "io-std"] }
tracing.workspace = true

[dev-dependencies]
devsshd = { path = "../../tools/devsshd" }
rove-kernel = { path = "../rove-kernel" }
rove-vault = { path = "../rove-vault", features = ["memory-key-cache"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
zeroize = "1"
