[package]
name = "roveterm"
description = "RoveTerm cross-platform smart terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "roveterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
rove-ai = { path = "../crates/rove-ai" }
rove-fs = { path = "../crates/rove-fs" }
rove-journal = { path = "../crates/rove-journal" }
rove-kernel = { path = "../crates/rove-kernel" }
rove-session = { path = "../crates/rove-session" }
rove-ssh = { path = "../crates/rove-ssh" }
rove-sync = { path = "../crates/rove-sync" }
rove-vault = { path = "../crates/rove-vault", features = ["memory-key-cache"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio-util.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.8.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
jiff.workspace = true
zeroize = "1"
tauri-plugin-clipboard-manager = "2.5.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
rove-pty = { path = "../crates/rove-pty" }
fontdb = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "0.1"

[dev-dependencies]
tempfile = "3"
