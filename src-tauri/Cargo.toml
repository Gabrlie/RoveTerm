[package]
name = "roveterm"
description = "RoveTerm cross-platform smart terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "roveterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rove-fs = { path = "../crates/rove-fs" }
rove-journal = { path = "../crates/rove-journal" }
rove-kernel = { path = "../crates/rove-kernel" }
rove-session = { path = "../crates/rove-session" }
rove-ssh = { path = "../crates/rove-ssh" }
rove-vault = { path = "../crates/rove-vault", features = ["memory-key-cache"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rove-pty = { path = "../crates/rove-pty" }
