[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "src-tauri/plugins/tauri-plugin-rove-mobile", "tools/*"]
exclude = ["third_party"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
jiff = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }

[patch."https://github.com/tailscale/tailscale-rs"]
tailscale = { path = "third_party/tailscale-patch/tailscale" }
ts_runtime = { path = "third_party/tailscale-patch/ts_runtime" }
ts_dataplane = { path = "third_party/tailscale-patch/ts_dataplane" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
